inherit_from: "configs/mono/tum/base_config.yaml"

Results:
  save_results: True
  save_dir: "results"
  save_trj: True
  use_gui: False
  eval_rendering: False
  use_wandb: False

Dataset:
  type: 'eth3d_mono'
  sensor_type: 'monocular'
  start_idx: 0
  end_idx: -1
  frame_stride: 1

  # Match the ETH3D SLAM evaluator default: only interpolate GT between
  # measurements separated by at most 1/75 s. Frames inside larger mocap/GT
  # holes remain normal SLAM/rendering inputs but are excluded from ATE.
  max_gt_interpolation_timespan_sec: 0.013333333333333334

  # Left RGB camera geometry is loaded per sequence from calibration.json
  # generated by rectify_eth3d_stereo.py.
