inherit_from: "configs/mono/tum/base_config.yaml"

Results:
  save_results: True
  save_dir: "results"
  save_trj: True
  use_gui: False
  eval_rendering: False
  use_wandb: False

Dataset:
  type: 'eth3d_mono'
  sensor_type: 'monocular'
  start_idx: 0
  end_idx: -1
  frame_stride: 1
  max_gt_gap_sec: 0.1

  # Left RGB camera geometry is loaded per sequence from calibration.json
  # generated by rectify_eth3d_stereo.py.
