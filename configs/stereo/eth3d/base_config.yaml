inherit_from: "configs/stereo/euroc/base_config.yaml"

Results:
  save_results: True
  save_dir: "results"
  save_trj: True
  use_gui: False
  eval_rendering: False
  use_wandb: False

Dataset:
  type: 'eth3d_stereo'
  sensor_type: 'stereo'
  start_idx: 0
  end_idx: -1
  frame_stride: 1

  # Match the ETH3D SLAM evaluator default: only interpolate GT between
  # measurements separated by at most 1/75 s. Frames inside larger mocap/GT
  # holes remain normal SLAM/rendering inputs but are excluded from ATE.
  max_gt_interpolation_timespan_sec: 0.013333333333333334

  # Geometry is loaded per sequence from calibration.json generated by
  # rectify_eth3d_stereo.py. Images are already stereo-rectified.
  # Preserve released MonoGS stereo SGBM settings.
  StereoMatching:
    num_disparities: 64
    block_size: 20
    uniqueness_ratio: 40
